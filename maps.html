<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--ink:#0b0a09;--panel:#1c1712;--panel-hi:#241d16;--parch:#e9dcc0;--dim:#bfae8c;
--mute:#8b7c62;--ember:#e08c38;--ember-hi:#f5b25c;--gold:#c9a227;--ox:#b53333;
--line:rgba(201,162,39,.22);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--parch);
font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 0 3rem}
header{text-align:center;padding:2rem 1rem 1.1rem;border-bottom:1px solid var(--line)}
h1{font-size:1.9rem;letter-spacing:.14em;font-variant:small-caps;margin:0;font-weight:600;
text-shadow:0 0 24px rgba(224,140,56,.4)}
.sub{font-size:.73rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:.4rem}
h2{font-size:1.08rem;color:var(--gold);letter-spacing:.1em;font-variant:small-caps;font-weight:600;
display:flex;gap:.7rem;align-items:center;margin:1.9rem 0 .8rem;padding:0 1rem}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
figure{margin:0 1rem 1rem;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
figure img{width:100%;display:block;cursor:zoom-in}
figcaption{padding:.55rem .9rem;font-size:.78rem;color:var(--mute);border-top:1px solid var(--line)}
.card{margin:0 1rem 1rem;padding:1rem;border:1px solid var(--line);border-radius:5px;
background:linear-gradient(180deg,var(--panel-hi),var(--panel))}
table{width:100%;border-collapse:collapse;font-size:.89rem}
td{padding:.5rem .4rem;border-bottom:1px solid rgba(201,162,39,.1);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{color:var(--ember-hi);white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
td.k{color:var(--gold);font-family:ui-monospace,Menlo,monospace;width:1.6rem}
.npc{display:flex;gap:.85rem;margin:0 1rem 1rem;padding:.9rem;border:1px solid var(--line);
border-radius:5px;background:linear-gradient(180deg,var(--panel-hi),var(--panel))}
.npc img{width:88px;height:88px;object-fit:cover;border-radius:3px;border:1px solid var(--line);flex:none}
.npc h3{margin:0;font-size:1.02rem;font-variant:small-caps;letter-spacing:.06em;font-weight:600}
.npc .role{font-size:.71rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:.3rem}
.npc p{margin:0;font-size:.87rem;line-height:1.48}
.note{margin:.7rem 1rem;padding:.65rem .85rem;border-left:3px solid var(--ember);
background:rgba(224,140,56,.08);font-size:.87rem;border-radius:0 4px 4px 0}
.note b{display:block;font-size:.61rem;letter-spacing:.18em;text-transform:uppercase;
color:var(--ember);margin-bottom:.22rem}
.clock{margin:1rem;padding:.85rem 1rem;border:1px solid rgba(181,51,51,.5);border-radius:5px;
background:linear-gradient(180deg,#241512,#1b100e);text-align:center}
.clock b{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#e08585}
.clock .big{font-family:ui-monospace,Menlo,monospace;font-size:1.6rem;color:var(--ember-hi);font-weight:700}
.nav{display:flex;gap:.5rem;margin:1rem;flex-wrap:wrap}
.nav a{flex:1;min-width:150px;text-align:center;padding:.7rem;border:1px solid var(--line);
border-radius:5px;color:var(--gold);text-decoration:none;font-variant:small-caps;letter-spacing:.09em;
background:var(--panel)}
.foot{text-align:center;font-size:.71rem;color:var(--mute);padding:2rem 1rem 1rem;line-height:1.8}
.foot a{color:var(--gold)}
@media(min-width:760px){.npc img{width:112px;height:112px}}
</style></head><body><div class="wrap">
